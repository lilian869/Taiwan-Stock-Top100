name: Daily Taiwan Stock Top100 Update
on:
  # Validate code/workflow changes immediately, but ignore data-only commits.
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  # Run after both exchanges' daily closing data has had time to publish.
  # 11:30 UTC = 19:30 Taiwan time, Monday to Friday.
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-stock-update-v12
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Backfill 120 trading days when needed
        run: python -m src.backfill --target-days 120
      - name: Collect daily market data
        run: python -m src.pipeline
      - name: Commit market snapshot and dashboard data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history docs/data/latest.json docs/data/stock_history

          if git diff --cached --quiet; then
            echo "[OK] No market data changes to commit."
            exit 0
          fi

          git commit -m "chore: update Taiwan stock market snapshot [skip ci]"

          # Another writer may update main while this job is collecting data.
          # Rebase onto the newest main before pushing; never force-push.
          for attempt in 1 2 3; do
            echo "[INFO] Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "[ERROR] Rebase conflict; refusing to overwrite remote data."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "[OK] Market snapshot committed and pushed."
              exit 0
            fi

            echo "[WARN] Push rejected; retrying after refreshing main."
            sleep $((attempt * 5))
          done

          echo "[ERROR] Could not push after 3 attempts."
          exit 1
