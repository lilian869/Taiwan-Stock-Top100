name: Fugle Intraday 5-Minute Pilot

on:
  schedule:
    # Taiwan 09:02-12:57 and 13:02-13:27 (UTC+8), weekdays.
    - cron: "2-57/5 1-4 * * 1-5"
    - cron: "2,7,12,17,22,27 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fugle-intraday-pilot
  cancel-in-progress: false

jobs:
  collect-intraday-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current website data from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: website
      - name: Checkout isolated Fugle pilot code
        uses: actions/checkout@v4
        with:
          ref: feature/fugle-intraday-api-pilot
          path: pilot-code
      - name: Use latest main Top 100 universe
        run: |
          mkdir -p pilot-code/docs/data
          cp website/docs/data/latest.json pilot-code/docs/data/latest.json
          python - <<'PY'
          import json
          p=json.load(open('pilot-code/docs/data/latest.json', encoding='utf-8'))
          rows=p.get('top100', [])
          codes=[str(x.get('code','')).strip() for x in rows]
          assert p.get('market_data_type') == 'daily_close', 'Unexpected source data type'
          assert len(rows) == 100 and len(set(codes)) == 100, 'Latest Top 100 must contain 100 unique codes'
          print(f"Universe date={p.get('date')} count={len(rows)} unique={len(set(codes))}")
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Collect 100-stock intraday snapshot
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          cd pilot-code
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python tools/fugle_intraday_snapshot.py --output artifacts/fugle_intraday_latest.json --delay 1.1 --market-hours-only
          else
            python tools/fugle_intraday_snapshot.py --output artifacts/fugle_intraday_latest.json --delay 1.1
          fi
      - name: Upload pilot snapshot (not published to website)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fugle-intraday-snapshot-${{ github.run_id }}
          path: pilot-code/artifacts/fugle_intraday_latest.json
          if-no-files-found: warn
          retention-days: 1
